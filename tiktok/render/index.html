<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Ролик</title>
<style>
  @font-face { font-family: "Montserrat"; src: url(fonts/Montserrat.ttf) format("truetype"); font-weight: 100 900; }
  @font-face { font-family: "Caveat"; src: url(fonts/Caveat.ttf) format("truetype"); font-weight: 400 700; }
  @font-face { font-family: "JetBrains Mono"; src: url(fonts/JetBrainsMono.ttf) format("truetype"); font-weight: 100 800; }
  html, body { margin: 0; background: #000; }
  canvas { display: block; }
  #bar { display: none; }
  .preview { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 8px; color: #aaa; font: 14px sans-serif; }
  .preview canvas { height: calc(100vh - 60px); width: auto; cursor: pointer; }
  .preview #bar { display: block; width: min(540px, 100%); }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<input id="bar" type="range" min="0" value="0">
<script src="lib.js"></script>
<script src="scenes.js"></script>
<script src="art.js"></script>
<script src="fantasy.js"></script>
<script src="survival.js"></script>
<script src="player.js"></script>
</body>
</html>
