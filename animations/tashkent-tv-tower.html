<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1080, initial-scale=1">
<title>How the Tashkent TV Tower was designed</title>
<style>
  html,body{margin:0;padding:0;background:#dfe5e6;overflow:hidden}
  #stage{position:absolute;left:0;top:0;width:1080px;height:1920px;overflow:hidden;transform-origin:0 0;background:#eef0ec}
  #c{position:absolute;left:0;top:0;width:1080px;height:1920px;display:block}
  #vig{position:absolute;inset:0;pointer-events:none;
       background:radial-gradient(ellipse 115% 78% at 50% 47%,rgba(0,0,0,0) 58%,rgba(16,36,42,.17) 100%)}
  #topfade{position:absolute;left:0;top:0;width:100%;height:470px;pointer-events:none;
       background:linear-gradient(to bottom,rgba(247,249,248,.94) 0%,rgba(247,249,248,.70) 42%,rgba(247,249,248,0) 100%)}
  #ui{position:absolute;inset:0;pointer-events:none;color:#11232a;
      font-family:"Inter","SF Pro Display","Segoe UI","Helvetica Neue",Roboto,"Noto Sans","DejaVu Sans",Arial,sans-serif}
  #svg{position:absolute;left:0;top:0;width:1080px;height:1920px;overflow:visible}

  /* ---------- title ---------- */
  #title{position:absolute;left:0;right:0;top:70px;text-align:center}
  #kicker{display:inline-flex;align-items:center;gap:14px;font-size:25px;font-weight:800;letter-spacing:6px;color:#0d8a83}
  .pin{width:22px;height:22px;border-radius:50% 50% 50% 0;background:#12a39a;transform:rotate(-45deg);position:relative;flex:none}
  .pin::after{content:"";position:absolute;left:7px;top:7px;width:8px;height:8px;border-radius:50%;background:#fff}
  h1{margin:12px 0 0;font-size:68px;line-height:1.03;font-weight:900;letter-spacing:-1.6px;color:#0f2027}
  h1 span{color:#0d8a83}
  #uline{margin:18px auto 0;height:6px;width:0;border-radius:3px;background:linear-gradient(90deg,#12a39a,#5fd0c4)}

  /* ---------- timeline ---------- */
  #tl{position:absolute;left:150px;width:780px;top:322px;height:54px;opacity:0}
  #tl .yr{position:absolute;top:12px;font-size:25px;font-weight:800;color:#5b6d72;letter-spacing:1px}
  #tl .a{left:0}#tl .b{right:0}
  #tl .track{position:absolute;left:132px;right:132px;top:24px;height:6px;border-radius:3px;background:rgba(20,50,56,.14)}
  #tl .fill{position:absolute;left:0;top:0;height:6px;border-radius:3px;background:#12a39a;width:0}
  #tl .knob{position:absolute;top:-19px;height:44px;width:112px;margin-left:-56px;border-radius:22px;background:#12a39a;
            color:#fff;font-size:26px;font-weight:900;line-height:44px;text-align:center;letter-spacing:1px;
            box-shadow:0 6px 18px rgba(13,110,104,.35)}

  /* ---------- 3D labels ---------- */
  .lbl{position:absolute;left:0;top:0;opacity:0;white-space:nowrap;background:#fff;border-radius:20px;
       padding:15px 24px 16px;box-shadow:0 14px 34px rgba(18,40,46,.20),0 2px 6px rgba(18,40,46,.12)}
  .lbl .t{font-weight:800;font-size:34px;letter-spacing:-.4px;color:#10222a;line-height:1.1}
  .lbl .s{font-weight:600;font-size:25px;color:#5a6b70;margin-top:5px;line-height:1.15}
  .lbl .s b{color:#0d8a83;font-weight:800}
  .lbl.big{padding:14px 28px 16px;text-align:left}
  .lbl.big .n{font-size:66px;font-weight:900;letter-spacing:-2px;line-height:1;color:#10222a}
  .lbl.big .n small{font-size:38px;letter-spacing:-.5px;margin-left:4px}
  .lbl.big .s{font-size:26px}
  .lbl.quake .row{display:flex;align-items:center;gap:18px}
  .lbl.quake .mag{font-size:64px;font-weight:900;letter-spacing:-2px;line-height:1;color:#0d8a83}
  .lbl.quake .cap{font-size:20px;font-weight:800;letter-spacing:3px;color:#5a6b70}
  .lbl.quake svg{display:block;margin-top:8px}

  /* ---------- ruler ---------- */
  #ruler{position:absolute;left:0;top:0;opacity:0;white-space:nowrap;background:#12a39a;color:#fff;border-radius:16px;
         padding:6px 16px 7px;font-size:30px;font-weight:900;letter-spacing:-.3px;box-shadow:0 8px 20px rgba(13,110,104,.35)}
  #ruler small{font-size:20px;font-weight:800;opacity:.85;margin-left:6px}

  /* ---------- lower thirds ---------- */
  .step{position:absolute;left:70px;right:70px;top:1388px;opacity:0;display:flex;align-items:stretch;
        background:#fff;border-radius:28px;box-shadow:0 18px 44px rgba(18,40,46,.22),0 2px 8px rgba(18,40,46,.10);overflow:hidden}
  .step .no{flex:none;width:118px;background:linear-gradient(160deg,#16ad9f,#0b7f7a);color:#fff;font-size:46px;font-weight:900;
            display:flex;align-items:center;justify-content:center;letter-spacing:-1px}
  .step .tx{padding:20px 28px 22px}
  .step .k{font-size:22px;font-weight:800;letter-spacing:4px;color:#0d8a83}
  .step .m{font-size:35px;font-weight:800;letter-spacing:-.4px;line-height:1.16;margin-top:6px;color:#10222a}
</style>
<script>window.DURATION = 20;</script>
<script type="importmap">
{ "imports": { "three": "https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.module.min.js" } }
</script>
</head>
<body>
<div id="stage">
  <canvas id="c" width="1080" height="1920"></canvas>
  <div id="vig"></div>
  <div id="topfade"></div>
  <div id="ui">
    <svg id="svg" width="1080" height="1920" viewBox="0 0 1080 1920"></svg>
    <div id="title">
      <div id="kicker"><span class="pin"></span>TASHKENT · UZBEKISTAN</div>
      <h1>How the <span>Tashkent</span><br>TV Tower was designed</h1>
      <div id="uline"></div>
    </div>
    <div id="tl">
      <div class="yr a">1978</div>
      <div class="track"><div class="fill"></div><div class="knob">1978</div></div>
      <div class="yr b">1985</div>
    </div>
    <div id="labels"></div>
    <div id="ruler">0 m</div>
    <div id="steps"></div>
  </div>
</div>

<script type="module">
import * as THREE from 'three';

/* =====================================================================
   Tashkent TV Tower — deterministic vertical 3D explainer.
   window.renderAt(t) draws the exact frame for time t (0..DURATION).
   ===================================================================== */
const W = 1080, H = 1920, DURATION = 20;
window.DURATION = DURATION;

/* ---------------- helpers ---------------- */
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
const prog = (t, a, b) => clamp((t - a) / (b - a));
const smooth = x => x * x * (3 - 2 * x);
const eOutCubic = x => 1 - Math.pow(1 - x, 3);
const eInOutCubic = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const eOutBack = x => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const eOutExpo = x => x >= 1 ? 1 : 1 - Math.pow(2, -10 * x);
const win = (t, a, b, fi = .35, fo = .35) => Math.min(clamp((t - a) / fi), clamp((b - t) / fo));
const invInOutCubic = u => u < .5 ? Math.cbrt(u / 4) : 1 - Math.cbrt(2 * (1 - u)) / 2;
const DEG = Math.PI / 180;
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const rnd = mulberry32(19781985);
const R = (a, b) => a + (b - a) * rnd();
const pick = arr => arr[Math.floor(rnd() * arr.length)];
const V3 = (x, y, z) => new THREE.Vector3(x, y, z);
const UP = V3(0, 1, 0);

/* ---------------- renderer / scene ---------------- */
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(1);
renderer.setSize(W, H, false);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.localClippingEnabled = true;

const scene = new THREE.Scene();
const SKY = { top: new THREE.Color(0xc4dce6), hor: new THREE.Color(0xf0f1ec), bot: new THREE.Color(0xe7e8e3) };
const SKY_WARM = { top: new THREE.Color(0xbfd4e2), hor: new THREE.Color(0xf7ebde), bot: new THREE.Color(0xebe6de) };
scene.fog = new THREE.FogExp2(SKY.hor.clone(), 0.00021);

const camera = new THREE.PerspectiveCamera(40, W / H, 8, 16000);
camera.setViewOffset(W, H, 0, 60, W, H);   // optical centre sits at y≈900 (room for title + captions)

/* ---------------- sky dome ---------------- */
const skyUniforms = {
  uTop: { value: SKY.top.clone() }, uHor: { value: SKY.hor.clone() }, uBot: { value: SKY.bot.clone() },
  uSun: { value: V3(-0.5, 0.6, 0.6).normalize() }, uSunCol: { value: new THREE.Color(0xfff0d8) }
};
const skyMat = new THREE.ShaderMaterial({
  uniforms: skyUniforms, side: THREE.BackSide, depthWrite: false, fog: false, toneMapped: false,
  vertexShader: `varying vec3 vW; void main(){ vec4 w = modelMatrix*vec4(position,1.0); vW = w.xyz - cameraPosition; gl_Position = projectionMatrix*viewMatrix*w; }`,
  fragmentShader: `uniform vec3 uTop; uniform vec3 uHor; uniform vec3 uBot; uniform vec3 uSun; uniform vec3 uSunCol; varying vec3 vW;
    void main(){
      vec3 d = normalize(vW); float h = d.y;
      vec3 c = mix(uHor, uTop, pow(smoothstep(0.0, 0.62, h), 0.85));
      if (h < 0.0) c = mix(uHor, uBot, smoothstep(0.0, 0.10, -h));
      float s = max(dot(d, normalize(uSun)), 0.0);
      c += uSunCol * (pow(s, 32.0) * 0.22 + pow(s, 4.0) * 0.05);
      gl_FragColor = vec4(c, 1.0);
      #include <colorspace_fragment>
    }`
});
const sky = new THREE.Mesh(new THREE.SphereGeometry(13000, 48, 24), skyMat);
sky.renderOrder = -10; sky.frustumCulled = false;
scene.add(sky);

/* environment for reflections (glass, water) */
{
  const envScene = new THREE.Scene();
  const envSky = new THREE.Mesh(new THREE.SphereGeometry(100, 32, 16), skyMat);
  envScene.add(envSky);
  const pm = new THREE.PMREMGenerator(renderer);
  var ENV_TEX = pm.fromScene(envScene, 0.02, 1, 400).texture;
  pm.dispose();
}

/* ---------------- lights ---------------- */
const hemi = new THREE.HemisphereLight(0xeef4f8, 0xcac5ba, 1.05);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff2e2, 3.1);
sun.castShadow = true;
sun.shadow.mapSize.set(4096, 4096);
Object.assign(sun.shadow.camera, { left: -820, right: 820, top: 820, bottom: -820, near: 50, far: 4200 });
sun.shadow.camera.updateProjectionMatrix();
sun.shadow.bias = -0.00035;
sun.shadow.normalBias = 0.45;
scene.add(sun, sun.target);
const SUN_AZ = 128 * DEG;

/* ---------------- procedural textures ---------------- */
function latticeTexture() {
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const g = c.getContext('2d');
  g.fillStyle = '#ffffff'; g.fillRect(0, 0, 128, 128);
  g.strokeStyle = '#d5dbde'; g.lineWidth = 6;
  g.beginPath(); g.moveTo(-4, -4); g.lineTo(132, 132); g.moveTo(132, -4); g.lineTo(-4, 132); g.stroke();
  g.strokeStyle = '#e3e7e8'; g.lineWidth = 5;
  g.beginPath(); g.moveTo(0, 2); g.lineTo(128, 2); g.stroke();
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8;
  return t;
}
function waterNormalTexture() {
  const S = 256, c = document.createElement('canvas'); c.width = c.height = S;
  const g = c.getContext('2d'), img = g.createImageData(S, S);
  const hf = (x, y) => { const u = x / S * 2 * Math.PI, v = y / S * 2 * Math.PI;
    return Math.sin(u * 3 + v * 2) * .5 + Math.sin(-u * 2 + v * 5 + 1.3) * .35 + Math.sin(u * 7 - v * 3 + 2.1) * .2 + Math.sin(u * 11 + v * 9 + .7) * .1; };
  for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) {
    const dx = (hf(x + 1, y) - hf(x - 1, y)) * 3, dy = (hf(x, y + 1) - hf(x, y - 1)) * 3;
    const l = Math.hypot(dx, dy, 1), i = (y * S + x) * 4;
    img.data[i] = (-dx / l * .5 + .5) * 255; img.data[i + 1] = (-dy / l * .5 + .5) * 255; img.data[i + 2] = (1 / l * .5 + .5) * 255; img.data[i + 3] = 255;
  }
  g.putImageData(img, 0, 0);
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; return t;
}
function glowTexture() {
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const g = c.getContext('2d'), gr = g.createRadialGradient(64, 64, 0, 64, 64, 64);
  gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(.25, 'rgba(255,255,255,.55)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = gr; g.fillRect(0, 0, 128, 128);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
const TEX_LATTICE = latticeTexture();
const TEX_WATER = waterNormalTexture();
const TEX_GLOW = glowTexture();
function scaleUV(geo, su, sv) { const uv = geo.attributes.uv; for (let i = 0; i < uv.count; i++) uv.setXY(i, uv.getX(i) * su, uv.getY(i) * sv); }

/* ---------------- materials ---------------- */
const M = {
  ground: new THREE.MeshStandardMaterial({ color: 0xcfd3d2, roughness: 1 }),
  plate: new THREE.MeshStandardMaterial({ color: 0xecece8, roughness: 1 }),
  bld: new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: .88 }),
  lawn: new THREE.MeshStandardMaterial({ color: 0xdbe5d0, roughness: 1 }),
  plaza: new THREE.MeshStandardMaterial({ color: 0xf2f1ec, roughness: .95 }),
  path: new THREE.MeshStandardMaterial({ color: 0xebe9e2, roughness: 1 }),
  bank: new THREE.MeshStandardMaterial({ color: 0xdadcd9, roughness: 1 }),
  water: new THREE.MeshStandardMaterial({ color: 0x1b8a86, roughness: .3, metalness: .05, normalMap: TEX_WATER, normalScale: new THREE.Vector2(.07, .07), envMap: ENV_TEX, envMapIntensity: .55 }),
  tree: new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: .9, flatShading: true }),
  trunk: new THREE.MeshStandardMaterial({ color: 0xc9c3b8, roughness: 1 }),
  dome: new THREE.MeshStandardMaterial({ color: 0x2ea39d, roughness: .35, metalness: .1, flatShading: true }),
  mountain: new THREE.MeshStandardMaterial({ color: 0xaebec7, roughness: 1, flatShading: true }),
  snow: new THREE.MeshStandardMaterial({ color: 0xf6f8f9, roughness: 1, flatShading: true, fog: false }),
  core: new THREE.MeshStandardMaterial({ color: 0xf6f7f5, map: TEX_LATTICE, roughness: .5, metalness: .05, flatShading: true }),
  leg: new THREE.MeshStandardMaterial({ color: 0xf2f4f3, map: TEX_LATTICE, roughness: .5, metalness: .05, flatShading: true, emissive: 0x12a39a, emissiveIntensity: 0 }),
  white: new THREE.MeshStandardMaterial({ color: 0xf4f5f3, roughness: .45, metalness: .05, flatShading: true }),
  band: new THREE.MeshStandardMaterial({ color: 0xc3cbcf, roughness: .4, metalness: .25, flatShading: true }),
  glass: new THREE.MeshStandardMaterial({ color: 0x1a5961, roughness: .05, metalness: .75, envMap: ENV_TEX, envMapIntensity: 1.5, emissive: 0xffb062, emissiveIntensity: 0 }),
  concrete: new THREE.MeshStandardMaterial({ color: 0xcfd0cb, roughness: .95, emissive: 0x12a39a, emissiveIntensity: 0 }),
  red: new THREE.MeshStandardMaterial({ color: 0xe0564b, roughness: .5, flatShading: true }),
};
const accentMat = new THREE.MeshBasicMaterial({ color: 0x12a39a, transparent: true, depthWrite: false, toneMapped: false, fog: false, side: THREE.DoubleSide });

/* =====================================================================
   CITY
   ===================================================================== */
const city = new THREE.Group(); scene.add(city);
const P = 115, RW = 16, NB = 13;
const canalX = z => -230 + 18 * Math.sin(z / 310 + .6);
const CANAL_HW = 21;
const nearCanal = (x, z, pad) => Math.abs(x - canalX(z)) < CANAL_HW + pad;

// ground
{
  const g = new THREE.Mesh(new THREE.PlaneGeometry(30000, 30000), M.ground);
  g.rotation.x = -Math.PI / 2; g.receiveShadow = true; city.add(g);
}

const boxes = [], plates = [], trees = [];
const WHITES = [0xf7f7f4, 0xf1f1ee, 0xececea, 0xf5f3ed, 0xe8eaea, 0xfafaf8, 0xefeeea, 0xe4e7e7];
function addBox(x, z, w, d, h, y0 = 0, col) {
  if (nearCanal(x, z, 5 + Math.max(w, d) / 2)) return false;
  boxes.push({ x, z, w, d, h, y0, col: col ?? pick(WHITES) });
  if (h > 14 && y0 === 0 && rnd() < .45) {
    const rw = w * R(.22, .42), rd = d * R(.22, .42);
    boxes.push({ x: x + R(-.2, .2) * w, z: z + R(-.2, .2) * d, w: rw, d: rd, h: R(2, 4.5), y0: h, col: pick(WHITES) });
  }
  return true;
}
function addTree(x, z, s = R(3.2, 5.6)) {
  if (nearCanal(x, z, s + 1)) return;
  trees.push({ x, z, s, h: R(1.8, 3.2), c: rnd() });
}

const DOME_BLOCKS = new Set(['3,-1', '-3,2', '1,-4', '-4,-3']);
const domeSpots = [];
for (let i = -NB; i <= NB; i++) for (let j = -NB; j <= NB; j++) {
  const cx = i * P, cz = j * P, d = Math.hypot(cx, cz);
  const park = Math.abs(i) <= 1 && Math.abs(j) <= 1;
  if (park) continue;
  plates.push({ x: cx, z: cz });
  if (d > 1250 && rnd() < (d - 1250) / 500) { // sparse outskirts
    if (rnd() < .5) for (let k = 0; k < 6; k++) addTree(cx + R(-40, 40), cz + R(-40, 40));
    continue;
  }
  // street trees on the block edges
  for (let e = 0; e < 4; e++) for (let s = -40; s <= 40; s += 13) {
    if (rnd() > .72) continue;
    const o = 44.5;
    const [x, z] = e === 0 ? [cx + s, cz - o] : e === 1 ? [cx + s, cz + o] : e === 2 ? [cx - o, cz + s] : [cx + o, cz + s];
    addTree(x, z);
  }
  if (DOME_BLOCKS.has(i + ',' + j)) { domeSpots.push({ x: cx, z: cz }); continue; }
  const hs = d < 520 ? 1 : d < 900 ? .8 : .6;
  const r = rnd();
  if (r < .07) { for (let k = 0; k < 22; k++) addTree(cx + R(-37, 37), cz + R(-37, 37)); continue; } // pocket park
  const mahalla = d > 650 ? .42 : d > 420 ? .2 : .05;
  if (r < .07 + mahalla) { // traditional low courtyard houses
    for (let a = 0; a < 4; a++) for (let b = 0; b < 4; b++) {
      const x = cx - 29 + a * 19.5 + R(-2, 2), z = cz - 29 + b * 19.5 + R(-2, 2);
      if (rnd() < .86) addBox(x, z, R(11, 15.5), R(11, 15.5), R(4, 7.5)); else addTree(x, z);
    }
    continue;
  }
  const r2 = rnd();
  if (r2 < .34) { // soviet-era slab blocks
    const along = rnd() < .5, L = R(56, 76), off = R(16, 22);
    for (const sgn of [-1, 1]) {
      const h = pick([15, 27, 27, 36, 15, 48]) * hs;
      along ? addBox(cx, cz + sgn * off, L, 13, h) : addBox(cx + sgn * off, cz, 13, L, h);
    }
    addTree(cx + R(-20, 20), cz + R(-5, 5)); addTree(cx + R(-20, 20), cz + R(-5, 5));
  } else if (r2 < .62) { // point buildings
    for (const sx of [-1, 1]) for (const sz of [-1, 1]) {
      if (rnd() < .12) { addTree(cx + sx * 19, cz + sz * 19, 6); continue; }
      const w = R(18, 28), dd = R(18, 28);
      addBox(cx + sx * 19.5, cz + sz * 19.5, w, dd, R(14, 44) * hs);
    }
  } else if (r2 < .82) { // courtyard perimeter block
    const h = R(15, 26) * hs;
    addBox(cx, cz - 31.5, 76, 13, h); addBox(cx, cz + 31.5, 76, 13, h);
    addBox(cx - 31.5, cz, 13, 50, h); addBox(cx + 31.5, cz, 13, 50, h);
    for (let k = 0; k < 5; k++) addTree(cx + R(-15, 15), cz + R(-15, 15), R(3.5, 5));
  } else { // tower on a podium
    addBox(cx, cz, 66, 66, R(6, 9));
    const th = d < 520 ? R(46, 82) : R(28, 44);
    addBox(cx + R(-8, 8), cz + R(-8, 8), R(22, 30), R(22, 30), th);
  }
}

// city plates (blocks), instanced
{
  const geo = new THREE.BoxGeometry(1, 1, 1); geo.translate(0, .5, 0);
  const m = new THREE.InstancedMesh(geo, M.plate, plates.length + 1);
  const mt = new THREE.Matrix4();
  plates.forEach((p, i) => { mt.compose(V3(p.x, 0, p.z), new THREE.Quaternion(), V3(P - RW, .35, P - RW)); m.setMatrixAt(i, mt); });
  mt.compose(V3(0, 0, 0), new THREE.Quaternion(), V3(3 * P - RW, .4, 3 * P - RW)); m.setMatrixAt(plates.length, mt); // park base
  m.receiveShadow = true; city.add(m);
}
// buildings, instanced
{
  const geo = new THREE.BoxGeometry(1, 1, 1); geo.translate(0, .5, 0);
  const m = new THREE.InstancedMesh(geo, M.bld, boxes.length);
  const mt = new THREE.Matrix4(), q = new THREE.Quaternion(), col = new THREE.Color();
  boxes.forEach((b, i) => { mt.compose(V3(b.x, b.y0 + .35, b.z), q, V3(b.w, b.h, b.d)); m.setMatrixAt(i, mt); m.setColorAt(i, col.setHex(b.col)); });
  m.castShadow = m.receiveShadow = true; city.add(m);
}

/* ---------------- park around the tower ---------------- */

function ridge(dist, hMin, hMax, n, mat, seed) {
  const pos = [], tops = [], NE = -40 * DEG;
  for (let i = 0; i <= n; i++) {
    const a = i / n * Math.PI * 2;
    const nz = .5 + .5 * (Math.sin(i * .37 + seed) * .5 + Math.sin(i * .113 + seed * 2.1) * .35 + Math.sin(i * 1.31 + seed) * .15);
    const bias = .22 + .78 * Math.pow(Math.max(0, Math.cos(a - NE)), .8);
    const h = lerp(hMin, hMax, nz) * bias * (.8 + .2 * rnd()) + 25;
    const r = dist + rnd() * 600;
    tops.push([Math.cos(a) * r, h, Math.sin(a) * r, a]);
  }
  for (let i = 0; i < n; i++) {
    const [x0, y0, z0, a0] = tops[i], [x1, y1, z1, a1] = tops[i + 1];
    const b0 = [Math.cos(a0) * (dist - 250), -30, Math.sin(a0) * (dist - 250)], b1 = [Math.cos(a1) * (dist - 250), -30, Math.sin(a1) * (dist - 250)];
    pos.push(...b0, x0, y0, z0, x1, y1, z1, ...b0, x1, y1, z1, ...b1);
  }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); g.computeVertexNormals();
  const m = new THREE.Mesh(g, mat); scene.add(m); return m;
}

const CK = [
  [0.0, 1780, 47, 0],
  [2.2, 960, 17, 168],
  [3.6, 560, 19, 55],
  [4.7, 370, 21, 30],
  [6.5, 460, 15, 70],
  [8.6, 440, 11, 60],
  [10.6, 218, 9, 104],
  [12.2, 255, 6, 112],
  [14.4, 1010, 4, 186],
  [16.1, 1200, 17, 178],
  [18.1, 1130, 3, 180],
  [20.0, 1070, 1, 182],

function track(idx, logv) {
  const T = CK.map(k => k[0]), Vv = CK.map(k => logv ? Math.log(k[idx]) : k[idx]), n = T.length;
  const Mt = Vv.map((v, i) => i === 0 ? (Vv[1] - Vv[0]) / (T[1] - T[0]) : i === n - 1 ? (Vv[n - 1] - Vv[n - 2]) / (T[n - 1] - T[n - 2]) : (Vv[i + 1] - Vv[i - 1]) / (T[i + 1] - T[i - 1]));

    let i = 0; while (i < n - 2 && t > T[i + 1]) i++;
    const h = T[i + 1] - T[i], s = clamp((t - T[i]) / h), s2 = s * s, s3 = s2 * s;
    const v = (2 * s3 - 3 * s2 + 1) * Vv[i] + (s3 - 2 * s2 + s) * h * Mt[i] + (-2 * s3 + 3 * s2) * Vv[i + 1] + (s3 - s2) * h * Mt[i + 1];

}

const AZ0 = -38 * DEG, AZ_SPEED = 8.4 * DEG;
const camAz = t => AZ0 + AZ_SPEED * t;

const _tgt = V3(0, 0, 0);
function setCamera(t) {
  const d = camDist(t), el = camElev(t) * DEG, az = camAz(t);

  camera.up.set(0, 1, 0);

}

    const sxz = lerp(.82, 1, eOutCubic(p));
    pp.obj.scale.set(sxz, 1, sxz);
    const fl = p > 0 ? 1 - prog(t, pp.t0 + .45, pp.t0 + 1.05) : 0;
    pp.obj.traverse(o => { if (o.isMesh && o.material !== M.glass && o.material !== M.white && o.material !== M.band && o.material.emissive) { o.material.emissive.setHex(0x9ff3ea); o.material.emissiveIntensity = .55 * fl * (p > .55 ? 1 : 0); } });
  }
  restaurantMullions.rotation.y = -Math.max(0, t - 10.2) * .45;
  {
    const a = win(t, 10.95, 12.5, .4, .3);
    spinArrow.visible = a > 0;
    spinArrow.scale.setScalar(Math.max(.001, eOutBack(prog(t, 10.95, 11.4))));
    spinArrow.rotation.y = -(t - 10.95) * 1.4;
    accentMat.opacity = .92 * a;
  }

  // --- landing rings ---
  for (const r of landRings) {
    const p = prog(t, r.t0, r.t0 + .75);
    r.m.visible = p > 0 && p < 1;
    if (!r.m.visible) continue;
    r.m.position.set(r.x || 0, r.y, r.z || 0);
    r.m.scale.setScalar(lerp(r.r0, r.r1, eOutCubic(p)));
    r.m.material.opacity = .7 * (1 - p);
  }
  // --- earthquake ---
  for (const q of quakeRings) {
    const p = prog(t, q.t0, q.t0 + 1.75);
    q.m.visible = p > 0 && p < 1;
    if (!q.m.visible) continue;
    q.m.position.y = 1.4; q.m.scale.setScalar(30 + 720 * eOutCubic(p));
    q.m.material.opacity = .95 * (1 - p);
  }
  const q = quakeEnv(t);
  tower.rotation.z = q * .0035 * Math.sin(t * Math.PI * 2 * 1.7);
  tower.rotation.x = q * .0025 * Math.sin(t * Math.PI * 2 * 1.3 + 1);
  city.position.set(q * .9 * Math.sin(t * 53), 0, q * .9 * Math.sin(t * 47 + 2));
}

function renderAt(t) {
  t = clamp(Number(t) || 0, 0, DURATION);
  setCamera(t);
  updateWorld(t);
  renderer.render(scene, camera);
  updateOverlays(t);
}
window.renderAt = renderAt;

/* fit the 1080×1920 stage into smaller windows for previewing (no effect at 1080×1920) */
function fit() {
  const s = Math.min(1, window.innerWidth / W, window.innerHeight / H);
  document.getElementById('stage').style.transform = s < 1 ? `scale(${s})` : '';
}
window.addEventListener('resize', fit); fit();

const qt = parseFloat(new URLSearchParams(location.search).get('t'));
renderAt(isFinite(qt) ? qt : 0);
window.READY = true;
document.dispatchEvent(new Event('renderer-ready'));
</script>
</body>
